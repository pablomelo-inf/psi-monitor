name: CI and release

# Every push to main and every pull request runs the unit tests, the linters
# (pre-commit) and a Trivy security scan. A push to main also publishes a
# GitHub release, but only when all three pass and the version in
# metadata.json.in has no release yet. See "Releases" in the README.
#
# Actions are pinned to full commit SHAs (the tag is in the comment), and
# Dependabot keeps them up to date.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: new vulnerabilities are published without any new commit.
    - cron: '23 5 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Check metadata and JS syntax
        run: make check
      - name: Run unit tests
        run: make test

  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install Prettier and ESLint
        run: npm ci
      - name: Install pre-commit
        id: pre-commit
        run: |
          python3 -m venv "${RUNNER_TEMP}/pre-commit"
          "${RUNNER_TEMP}/pre-commit/bin/pip" install --quiet pre-commit==4.6.2
          echo "${RUNNER_TEMP}/pre-commit/bin" >> "${GITHUB_PATH}"
          echo "python=$(python3 -c 'import sys; print("%d.%d" % sys.version_info[:2])')" >> "${GITHUB_OUTPUT}"

      # The hook environments (including the ShellCheck binary that its package
      # downloads while installing) are cached, so most runs download nothing.
      # The key changes with the hook config and the Python version.
      - name: Restore the pre-commit hook environments
        id: hooks-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py${{ steps.pre-commit.outputs.python }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # Installing needs the network, and the host that serves ShellCheck
      # sometimes answers 5xx. Retry only this step: retrying the hooks
      # themselves would hide real lint failures.
      - name: Install the hook environments
        run: |
          for attempt in 1 2 3; do
            pre-commit install-hooks && exit 0
            echo "Attempt ${attempt} failed" >&2
            sleep $((attempt * 15))
          done
          exit 1

      # Saved right after installing, so the cache is kept even if a hook fails.
      - name: Save the pre-commit hook environments
        if: steps.hooks-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: ${{ steps.hooks-cache.outputs.cache-primary-key }}

      - name: Run every hook on every file
        run: pre-commit run --all-files --show-diff-on-failure

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan the repository with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # Also scan the npm dev dependencies (ESLint, Prettier): they run in CI
          # and on developer machines. Trivy skips them by default.
          TRIVY_INCLUDE_DEV_DEPS: 'true'
        with:
          scan-type: fs
          scan-ref: .
          # Known vulnerabilities in dependencies (package-lock.json), secrets
          # committed by mistake, and misconfigurations.
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

  release:
    needs: [test, lint, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the only write access: create the tag and publish the release
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # The UUID suffix is the repository owner, so the zip never depends on
      # anyone's local config.mk.
      HANDLE: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Decide whether a release is needed
        id: version
        run: |
          version="$(make -s version)"
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists. Bump version-name to publish a new one."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract the changelog notes
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/release-notes.sh "${VERSION}" > release-notes.md

      - name: Build the zip and the .deb
        if: steps.version.outputs.publish == 'true'
        run: |
          make pack HANDLE="${HANDLE}"
          make deb HANDLE="${HANDLE}"
          cd dist
          sha256sum "psi-monitor@${HANDLE}.shell-extension.zip" \
            gnome-shell-extension-psi-monitor_*_all.deb > SHA256SUMS

      - name: Publish the release
        if: steps.version.outputs.publish == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "${TAG}" \
            "dist/psi-monitor@${HANDLE}.shell-extension.zip" \
            dist/gnome-shell-extension-psi-monitor_*_all.deb \
            dist/SHA256SUMS \
            --title "${TAG}" \
            --notes-file release-notes.md \
            --target "${GITHUB_SHA}"
