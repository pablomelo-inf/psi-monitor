# Keeps the pinned GitHub Actions SHAs and the npm dev tools up to date.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Do not adopt a version in its first week: compromised releases are
    # usually caught and pulled within days.
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
